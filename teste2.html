<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exemplo de reCAPTCHA com Link</title>
<script src="https://www.google.com/recaptcha/api.js" async defer></script>
<style type="text/css">
  /* Estilos para o pop-up modal */
.modal {
  display: none;
  position: fixed;
  z-index: 1;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.4);
}

.modal-content {
  background-color: #fefefe;
  margin: 10% auto;
  padding: 20px;
  border: 1px solid #888;
  width: 80%;
}

.close {
  color: #aaa;
  float: right;
  font-size: 28px;
  font-weight: bold;
}

.close:hover,
.close:focus {
  color: black;
  text-decoration: none;
  cursor: pointer;
}

</style>
</head>
<body>

<!-- Link para abrir o pop-up -->
<a id="open-modal">Enviar mensagem via WhatsApp</a>

<!-- Pop-up modal -->
<div id="modal" class="modal">
  <div class="modal-content">
    <span class="close">&times;</span>
    <div class="g-recaptcha" data-sitekey="6Lf3K6caAAAAAOPxQp3axKLQaiTheUcffGImFPbP"></div>
    <!-- Botão para enviar o formulário -->
    <button id="submit-button">Enviar mensagem</button>
  </div>
</div>

<script type="text/javascript">
// Abrir o pop-up quando o link é clicado
document.getElementById("open-modal").addEventListener("click", function(event) {
  event.preventDefault(); // Impede o comportamento padrão do link
  document.getElementById("modal").style.display = "block";
});

// Fechar o pop-up quando o usuário clicar no botão de fechar
document.getElementsByClassName("close")[0].addEventListener("click", function() {
  document.getElementById("modal").style.display = "none";
});

// Lidar com o envio do formulário
document.getElementById("submit-button").addEventListener("click", function() {
  // Obtém o token do reCAPTCHA
  var token = grecaptcha.getResponse();

  // Verifica se o token foi obtido
  if (token) {
    // Abre o link para o WhatsApp em uma nova aba
    window.open("https://api.whatsapp.com/send?phone=5519999088253", "_blank");
    window.location.reload();
    // Fecha o pop-up modal
    document.getElementById("modal").style.display = "none";
  } else {
    // Se o token não foi obtido, exiba uma mensagem de erro
    alert("Por favor, complete o reCAPTCHA antes de enviar.");
  }
});
</script>
</body>
</html>
