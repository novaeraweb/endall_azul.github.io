<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Envio de Orçamento - Endall</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --cor-primaria: #0D1B2A;
            --cor-secundaria: #F5A623;
            --cor-sucesso: #28a745;
            --cor-erro: #dc3545;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--cor-primaria) 0%, #1a2f4a 100%);
            min-height: 100vh;
            padding: 2rem;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 3rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: var(--cor-primaria);
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .debug-box {
            background: #f8f9fa;
            border-left: 4px solid var(--cor-secundaria);
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-radius: 8px;
        }
        
        .debug-box h3 {
            margin-top: 0;
            color: var(--cor-secundaria);
        }
        
        .log {
            background: #2d2d2d;
            color: #f8f8f2;
            padding: 1rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 1rem;
        }
        
        .log-item {
            padding: 0.25rem 0;
            border-bottom: 1px solid #444;
        }
        
        .log-item.sucesso {
            color: #50fa7b;
        }
        
        .log-item.erro {
            color: #ff5555;
        }
        
        .btn {
            display: inline-block;
            padding: 1rem 2rem;
            background: var(--cor-secundaria);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
            margin: 0.5rem;
        }
        
        .btn:hover {
            background: #e09416;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: var(--cor-sucesso);
        }
        
        .btn-success:hover {
            background: #218838;
        }
        
        .status {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            font-weight: 600;
            margin-left: 1rem;
        }
        
        .status-ok {
            background: #d4edda;
            color: #155724;
        }
        
        .status-erro {
            background: #f8d7da;
            color: #721c24;
        }
        
        .actions {
            text-align: center;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <i class="fas fa-vial"></i>
            Teste de Envio de Orçamento
        </h1>
        
        <div class="debug-box">
            <h3><i class="fas fa-info-circle"></i> Status do Sistema</h3>
            <div id="statusSistema"></div>
        </div>
        
        <div class="debug-box">
            <h3><i class="fas fa-terminal"></i> Log de Debug</h3>
            <div class="log" id="logContainer"></div>
            <button class="btn" onclick="limparLog()">
                <i class="fas fa-eraser"></i> Limpar Log
            </button>
        </div>
        
        <div class="debug-box">
            <h3><i class="fas fa-play"></i> Ações de Teste</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center;">
                <button class="btn" onclick="testeCarrinho()">
                    <i class="fas fa-shopping-cart"></i> 1. Testar Carrinho
                </button>
                <button class="btn" onclick="testeFormulario()">
                    <i class="fas fa-file-alt"></i> 2. Testar Formulário
                </button>
                <button class="btn btn-success" onclick="testeCompleto()">
                    <i class="fas fa-check-double"></i> 3. Teste Completo
                </button>
            </div>
        </div>
        
        <div class="actions">
            <a href="orcamento.php" class="btn">
                <i class="fas fa-file-invoice"></i> Ir para Orçamento Real
            </a>
            <a href="corrigir-carrinho.html" class="btn">
                <i class="fas fa-tools"></i> Corrigir Carrinho
            </a>
        </div>
    </div>
    
    <!-- Carregar carrinho.js -->
    <script src="assets/js/carrinho.js"></script>
    
    <script>
        // Função para adicionar log
        function log(mensagem, tipo = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const classe = tipo === 'sucesso' ? 'sucesso' : tipo === 'erro' ? 'erro' : '';
            
            const item = document.createElement('div');
            item.className = 'log-item ' + classe;
            item.textContent = `[${timestamp}] ${mensagem}`;
            
            logContainer.appendChild(item);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function limparLog() {
            document.getElementById('logContainer').innerHTML = '';
            log('Log limpo');
        }
        
        // Atualizar status do sistema
        function atualizarStatus() {
            const statusDiv = document.getElementById('statusSistema');
            
            let html = '<ul style="list-style: none; padding: 0;">';
            
            // 1. Verificar localStorage
            if (typeof(Storage) !== "undefined") {
                html += '<li><i class="fas fa-check" style="color: green;"></i> <strong>localStorage:</strong> <span class="status status-ok">Disponível</span></li>';
            } else {
                html += '<li><i class="fas fa-times" style="color: red;"></i> <strong>localStorage:</strong> <span class="status status-erro">Não disponível</span></li>';
            }
            
            // 2. Verificar Carrinho
            if (typeof Carrinho !== 'undefined') {
                const total = Carrinho.contar();
                html += '<li><i class="fas fa-check" style="color: green;"></i> <strong>Objeto Carrinho:</strong> <span class="status status-ok">Carregado (' + total + ' itens)</span></li>';
            } else {
                html += '<li><i class="fas fa-times" style="color: red;"></i> <strong>Objeto Carrinho:</strong> <span class="status status-erro">Não carregado</span></li>';
            }
            
            // 3. Verificar carrinho no localStorage
            const carrinhoData = localStorage.getItem('endall_carrinho');
            if (carrinhoData) {
                try {
                    const carrinho = JSON.parse(carrinhoData);
                    html += '<li><i class="fas fa-check" style="color: green;"></i> <strong>Dados no localStorage:</strong> <span class="status status-ok">' + carrinho.length + ' produtos</span></li>';
                } catch (e) {
                    html += '<li><i class="fas fa-times" style="color: red;"></i> <strong>Dados no localStorage:</strong> <span class="status status-erro">JSON inválido</span></li>';
                }
            } else {
                html += '<li><i class="fas fa-exclamation-triangle" style="color: orange;"></i> <strong>Dados no localStorage:</strong> <span class="status" style="background: #fff3cd; color: #856404;">Vazio</span></li>';
            }
            
            html += '</ul>';
            statusDiv.innerHTML = html;
        }
        
        // Teste 1: Testar Carrinho
        function testeCarrinho() {
            log('=== TESTE 1: Carrinho ===');
            
            if (typeof Carrinho === 'undefined') {
                log('❌ Objeto Carrinho não está definido', 'erro');
                return false;
            }
            log('✅ Objeto Carrinho existe', 'sucesso');
            
            const total = Carrinho.contar();
            log(`Total de itens no carrinho: ${total}`);
            
            if (total === 0) {
                log('⚠️  Carrinho está vazio', 'erro');
                log('Use a ferramenta "Corrigir Carrinho" para adicionar um produto de teste');
                return false;
            }
            
            const carrinho = Carrinho.obter();
            log(`✅ Carrinho contém ${carrinho.length} produto(s)`, 'sucesso');
            
            carrinho.forEach((item, index) => {
                log(`  Produto ${index + 1}: ${item.sku} - ${item.nome}`);
            });
            
            return true;
        }
        
        // Teste 2: Testar Formulário
        function testeFormulario() {
            log('=== TESTE 2: prepararParaEnvio() ===');
            
            if (typeof Carrinho === 'undefined') {
                log('❌ Objeto Carrinho não definido', 'erro');
                return false;
            }
            
            if (typeof Carrinho.prepararParaEnvio !== 'function') {
                log('❌ Função prepararParaEnvio() não existe', 'erro');
                return false;
            }
            log('✅ Função prepararParaEnvio() existe', 'sucesso');
            
            try {
                const itens = Carrinho.prepararParaEnvio();
                log(`✅ prepararParaEnvio() executado com sucesso`, 'sucesso');
                log(`Total de itens preparados: ${itens.length}`);
                
                if (itens.length === 0) {
                    log('⚠️  Nenhum item retornado', 'erro');
                    return false;
                }
                
                const json = JSON.stringify(itens);
                log(`JSON gerado (${json.length} caracteres):`);
                log(json.substring(0, 200) + '...');
                
                // Verificar estrutura
                const primeiroItem = itens[0];
                log('Estrutura do primeiro item:');
                log(`  - produto_id: ${primeiroItem.produto_id} (${typeof primeiroItem.produto_id})`);
                log(`  - sku: ${primeiroItem.sku}`);
                log(`  - nome: ${primeiroItem.nome}`);
                log(`  - quantidade: ${primeiroItem.quantidade}`);
                
                return true;
            } catch (e) {
                log('❌ ERRO ao executar prepararParaEnvio()', 'erro');
                log(`Erro: ${e.message}`, 'erro');
                return false;
            }
        }
        
        // Teste 3: Teste Completo
        function testeCompleto() {
            log('=== TESTE 3: Fluxo Completo ===');
            
            // 1. Testar carrinho
            if (!testeCarrinho()) {
                log('❌ Teste do carrinho falhou', 'erro');
                return;
            }
            
            // 2. Testar formulário
            if (!testeFormulario()) {
                log('❌ Teste do formulário falhou', 'erro');
                return;
            }
            
            // 3. Simular envio
            log('=== Simulando envio do formulário ===');
            
            try {
                const itens = Carrinho.prepararParaEnvio();
                const itensJson = JSON.stringify(itens);
                
                // Dados do formulário
                const dados = {
                    cliente_nome: 'João da Silva (TESTE)',
                    cliente_email: 'teste@exemplo.com',
                    cliente_telefone: '(11) 98765-4321',
                    cliente_empresa: 'Empresa Teste Ltda',
                    cliente_cargo: 'Gerente',
                    cliente_mensagem: 'Esta é uma mensagem de teste',
                    itens_json: itensJson
                };
                
                log('✅ Dados do formulário preparados:', 'sucesso');
                log(`  - Nome: ${dados.cliente_nome}`);
                log(`  - E-mail: ${dados.cliente_email}`);
                log(`  - Telefone: ${dados.cliente_telefone}`);
                log(`  - JSON: ${itensJson.length} caracteres`);
                
                log('');
                log('✅ TESTE COMPLETO PASSOU!', 'sucesso');
                log('O formulário está pronto para envio real.', 'sucesso');
                log('');
                log('Próximo passo: Ir para "Orçamento Real" e preencher o formulário');
                
            } catch (e) {
                log('❌ ERRO no teste completo', 'erro');
                log(`Erro: ${e.message}`, 'erro');
            }
        }
        
        // Executar ao carregar
        window.addEventListener('DOMContentLoaded', function() {
            log('Sistema de teste carregado');
            atualizarStatus();
            
            // Atualizar status a cada 2 segundos
            setInterval(atualizarStatus, 2000);
        });
    </script>
</body>
</html>
