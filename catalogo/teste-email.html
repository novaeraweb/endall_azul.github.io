<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de E-mail - Endall Inspeções</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0D1B2A 0%, #1B2D3E 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }
        
        .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo h1 {
            color: #0D1B2A;
            font-size: 2rem;
            margin-bottom: 5px;
        }
        
        .logo p {
            color: #F5A623;
            font-weight: 600;
            font-size: 0.875rem;
        }
        
        h2 {
            color: #0D1B2A;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .info-box {
            background: #F4F6F9;
            border-left: 4px solid #F5A623;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        
        .info-box h3 {
            color: #0D1B2A;
            margin-bottom: 10px;
            font-size: 1.125rem;
        }
        
        .info-box p {
            color: #374151;
            line-height: 1.6;
            margin-bottom: 8px;
        }
        
        .info-box strong {
            color: #0D1B2A;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            color: #0D1B2A;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input[type="email"] {
            width: 100%;
            padding: 14px;
            border: 2px solid #E5E7EB;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s;
        }
        
        input[type="email"]:focus {
            outline: none;
            border-color: #F5A623;
            box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.1);
        }
        
        .btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #F5A623 0%, #FF8C00 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.125rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(245, 166, 35, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #9CA3AF;
            cursor: not-allowed;
            transform: none;
        }
        
        .resultado {
            margin-top: 30px;
            padding: 20px;
            border-radius: 8px;
            display: none;
        }
        
        .resultado.sucesso {
            background: #D1FAE5;
            border: 2px solid #10B981;
            color: #065F46;
        }
        
        .resultado.erro {
            background: #FEE2E2;
            border: 2px solid #EF4444;
            color: #991B1B;
        }
        
        .resultado h3 {
            margin-bottom: 10px;
            font-size: 1.25rem;
        }
        
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        
        .loading-spinner {
            border: 4px solid #E5E7EB;
            border-top: 4px solid #F5A623;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .checklist {
            list-style: none;
            margin-top: 15px;
        }
        
        .checklist li {
            padding: 8px 0;
            color: #374151;
        }
        
        .checklist li::before {
            content: '✓';
            color: #10B981;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>ENDALL INSPEÇÕES</h1>
            <p>TESTE DE E-MAIL</p>
        </div>
        
        <h2>🧪 Testar Sistema de E-mail</h2>
        
        <div class="info-box">
            <h3>📧 Configuração SMTP Atual</h3>
            <p><strong>Servidor:</strong> smtp.umbler.com</p>
            <p><strong>Porta:</strong> 587 (TLS)</p>
            <p><strong>Remetente:</strong> contato@novaeraweb.com.br</p>
            <p><strong>Status:</strong> <span style="color: #10B981;">✓ Configurado</span></p>
        </div>
        
        <form id="formTeste">
            <div class="form-group">
                <label for="email">Digite seu e-mail para receber o teste:</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="seu@email.com" 
                    required
                    autocomplete="email">
            </div>
            
            <button type="submit" class="btn" id="btnEnviar">
                📨 Enviar E-mail de Teste
            </button>
        </form>
        
        <div class="loading" id="loading">
            <div class="loading-spinner"></div>
            <p>Enviando e-mail, aguarde...</p>
        </div>
        
        <div class="resultado" id="resultado"></div>
    </div>
    
    <script>
        document.getElementById('formTeste').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const btnEnviar = document.getElementById('btnEnviar');
            const loading = document.getElementById('loading');
            const resultado = document.getElementById('resultado');
            
            // Esconde resultado anterior
            resultado.style.display = 'none';
            resultado.className = 'resultado';
            
            // Mostra loading
            loading.style.display = 'block';
            btnEnviar.disabled = true;
            btnEnviar.textContent = 'Enviando...';
            
            try {
                const response = await fetch(`enviar-email.php?teste=1&email=${encodeURIComponent(email)}`);
                const data = await response.json();
                
                loading.style.display = 'none';
                resultado.style.display = 'block';
                
                if (data.sucesso) {
                    resultado.className = 'resultado sucesso';
                    resultado.innerHTML = `
                        <h3>✅ E-mail Enviado com Sucesso!</h3>
                        <p>${data.mensagem}</p>
                        <ul class="checklist">
                            <li>Verifique sua caixa de entrada</li>
                            <li>Confira também a caixa de spam</li>
                            <li>O e-mail pode levar alguns segundos para chegar</li>
                        </ul>
                    `;
                    
                    // Reseta o formulário
                    document.getElementById('email').value = '';
                    
                } else {
                    resultado.className = 'resultado erro';
                    resultado.innerHTML = `
                        <h3>❌ Erro ao Enviar E-mail</h3>
                        <p>${data.mensagem}</p>
                        <ul class="checklist" style="list-style: disc; padding-left: 20px; margin-top: 15px;">
                            <li>Verifique a configuração SMTP em includes/config.php</li>
                            <li>Confirme se PHPMailer está instalado</li>
                            <li>Veja os logs do PHP para mais detalhes</li>
                            <li>Consulte CONFIGURACAO-EMAIL.md para troubleshooting</li>
                        </ul>
                    `;
                }
                
            } catch (error) {
                loading.style.display = 'none';
                resultado.style.display = 'block';
                resultado.className = 'resultado erro';
                resultado.innerHTML = `
                    <h3>❌ Erro de Conexão</h3>
                    <p>Não foi possível conectar ao servidor: ${error.message}</p>
                    <p style="margin-top: 10px;"><strong>Verifique se o servidor está rodando.</strong></p>
                `;
            }
            
            btnEnviar.disabled = false;
            btnEnviar.textContent = '📨 Enviar E-mail de Teste';
        });
    </script>
</body>
</html>
